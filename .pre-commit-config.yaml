# Instalar con:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-real-camera-data
        name: "Sin datos reales de la cámara"
        entry: python tools/check_no_secrets.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # El mensaje de commit no lo mira nadie más: este escáner sólo ve
      # `git ls-files` y gitleaks sólo ve los parches. Ahí estuvo la fuga.
      - id: no-real-camera-data-in-message
        name: "Sin datos reales en el mensaje de commit"
        entry: python tools/check_no_secrets.py --commit-msg
        language: system
        stages: [commit-msg]
