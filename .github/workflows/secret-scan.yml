name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

# Este repositorio describe una cámara de casa: lo que hay que impedir a toda
# costa es que se cuele una IP, un puerto abierto, un usuario o una contraseña.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  own-rules:
    name: Datos reales de la cámara
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/check_no_secrets.py
