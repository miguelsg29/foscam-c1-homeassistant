name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

# Este repositorio describe una cámara de casa: lo que hay que impedir a toda
# costa es que se cuele una IP, un puerto abierto, un usuario o una contraseña.
#
# Ejecutamos el binario de gitleaks directamente en vez de gitleaks-action@v2,
# que va sobre Node 20 (en proceso de retirada en los runners de GitHub) y
# arrastra una comprobación de licencia que aquí no hace falta. Así además
# fijamos la versión y escaneamos todo el historial, no sólo el último commit.
env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Escanear todo el historial
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --exit-code 1

  own-rules:
    name: Datos reales de la cámara
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/check_no_secrets.py
