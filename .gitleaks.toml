# Configuración de gitleaks para este repositorio.
#
# Además de las reglas por defecto, añadimos detectores específicos de lo que
# se nos podría escapar en un repo de integración doméstica: URLs CGI de Foscam
# con credenciales, IPs privadas y puertos del router.
#
# OJO: gitleaks usa RE2 (Go), que NO soporta lookahead ni lookbehind. Los
# marcadores de posición se excluyen con bloques [[rules.allowlists]], no con
# `(?!...)` dentro del propio patrón.

title = "git_foscam"

[extend]
useDefault = true

[[rules]]
id = "foscam-cgi-credentials"
description = "URL de CGIProxy.fcgi con usr= y pwd= en claro"
regex = '''CGIProxy\.fcgi[^"'\s]*[?&](usr|pwd)=[^&"'\s]+'''
tags = ["foscam", "credentials"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''(?i)(your_|tu_|<[a-z_]+>|\{\{|\$\{|!secret|x{3,}|usuario|contrase|camera_user)''']

[[rules]]
id = "foscam-pwd-param"
description = "Parámetro pwd= con un valor que no es un marcador"
regex = '''(?i)[?&]pwd=[^\s&"'<>]{3,}'''
tags = ["foscam", "credentials"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''(?i)pwd=(your_|tu_|%|\{\{|\$\{|!secret|x{3,}|usuario|contrase|camera_password|\{|\+|a\+b)''']

[[rules]]
id = "foscam-usr-param"
description = "Parámetro usr= con un valor que no es un marcador"
regex = '''(?i)[?&]usr=[^\s&"'<>]{3,}'''
tags = ["foscam", "credentials"]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''(?i)usr=(your_|tu_|%|\{\{|\$\{|!secret|x{3,}|usuario|camera_user|\{)''']

[[rules]]
id = "private-ipv4"
description = "Dirección IP privada codificada a fuego"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["network"]

[allowlist]
description = "Marcadores de posición y ejemplos deliberados"
regexes = [
  '''192\.0\.2\.\d{1,3}''',          # TEST-NET-1, reservado para documentación
  '''203\.0\.113\.\d{1,3}''',        # TEST-NET-3
  '''(?i)192\.168\.x\.x''',
]
paths = [
  '''\.gitleaks\.toml$''',
  '''(^|/)\.git/''',
  '''^tools/check_no_secrets\.py$''',  # contiene los patrones a propósito
]
